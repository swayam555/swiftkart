# Two replicas: one wins the Redis leader lease and runs the fleet simulation, the other serves
# reads and takes over within ~5 s if the leader dies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-service
  labels: { app: dispatch-service, tier: app }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: dispatch-service }
  template:
    metadata:
      labels: { app: dispatch-service, tier: app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8093"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: dispatch-service
          image: ghcr.io/your-org/swiftkart-dispatch-service:1.0.0
          ports: [{ containerPort: 8093, name: http }]
          envFrom:
            - configMapRef: { name: swiftkart-config }
            - secretRef: { name: swiftkart-secrets }
          env:
            - { name: PORT, value: "8093" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
spec:
  selector: { app: dispatch-service }
  ports: [{ port: 8093, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dispatch-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dispatch-service }
