apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swiftkart
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - apps.yaml
  - frontend.yaml
  - network-policy.yaml
# Point the images at your registry, e.g.  kustomize edit set image ghcr.io/your-org/...=...
images:
  - name: ghcr.io/your-org/swiftkart-gateway
    newTag: 1.0.0
  - name: ghcr.io/your-org/swiftkart-order-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/swiftkart-inventory-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/swiftkart-dispatch-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/swiftkart-frontend
    newTag: 1.0.0
