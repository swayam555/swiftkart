spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Each route has exactly one rate limiter. (Stacking a global default-filter limiter on
          # top of a route's own limiter makes both share one Redis bucket with conflicting settings.)
          routes:
            # Checkout is the expensive, abusable call: a tighter bucket per user.
            - id: checkout
              uri: ${ORDER_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/orders
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 10
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/orders/**,/api/ops/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/stores/**,/api/catalog/**,/api/inventory/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
            - id: dispatch
              uri: ${DISPATCH_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/dispatch/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200

server:
  port: ${PORT:8080}

swiftkart:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-32+-byte-dev-secret}
  ops:
    username: ${OPS_USERNAME:ops}
    password: ${OPS_PASSWORD:swiftkart}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
