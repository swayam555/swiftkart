spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:swiftkart}
    password: ${DB_PASSWORD:swiftkart}
    hikari:
      maximum-pool-size: 30
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
  mvc:
    async:
      request-timeout: -1

server:
  port: ${PORT:8091}
  shutdown: graceful
  tomcat:
    # Flash sales open hundreds of connections in the same instant; the default backlog of
    # 100 would refuse some of them.
    accept-count: 1000
    max-connections: 10000

swiftkart:
  time-scale: ${TIME_SCALE:6}
  inventory-url: ${INVENTORY_URL:http://localhost:8092}
  payment-failure-rate: 0.03
  reservation-ttl-seconds: ${RESERVATION_TTL_SECONDS:120}

springdoc:
  api-docs:
    path: /api/orders/openapi
  swagger-ui:
    path: /api/orders/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
